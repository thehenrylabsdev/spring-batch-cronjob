# TEMPLATE ONLY — credentials MUST come from Kubernetes Secrets / external secret
# manager (SPEC 50). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: batch-db-secret
  namespace: batch
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "REPLACE_ME"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
---
# PVC templates for local input + processing volumes.
# Completely placeholder: replace with object storage mount/CSI driver as required.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: batch-input-pvc
  namespace: batch
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: batch-processing-pvc
  namespace: batch
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 20Gi
